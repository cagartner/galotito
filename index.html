          const list = q ? players.value.filter(p => p.name.toLowerCase().includes(q)) : players.value;
          return gkFirst(list); // goleiros no topo, depois alfabetico
        });
        function computeStandings(list) {
          const map = {};
          const ensure = (name) => (map[name] || (map[name] = { name, jogos: 0, vitorias: 0, empates: 0, derrotas: 0 }));
          const tally = (names, side, winner) => (names || []).forEach(n => {
            const s = ensure(n); s.jogos++;
            if (winner === 'empate') s.empates++;
            else if (winner === side) s.vitorias++;
            else s.derrotas++;
          });
          for (const m of (list || [])) { tally(m.preto, 'preto', m.winner); tally(m.vermelho, 'vermelho', m.winner); }
          const arr = Object.values(map).map(s => ({ ...s, pontos: s.vitorias * 3 + s.empates }));
          arr.sort((a, b) => b.pontos - a.pontos || b.vitorias - a.vitorias || a.name.localeCompare(b.name));
          return arr;
        }
        function matchesForDay(day) {
          return day === currentDay.value ? matches.value : JSON.parse(localStorage.getItem('sorteio_' + day + '_matches') || '[]');
        }
        const rankingMatches = Vue.computed(() => rankingScope.value === 'somado'
          ? [...matchesForDay('segunda'), ...matchesForDay('quarta')]
          : matchesForDay(rankingScope.value));
        const standingsView = Vue.computed(() => computeStandings(rankingMatches.value));

        // Presenca: quantos DIAS distintos cada jogador compareceu (+ total de partidas)
        function computeAttendance(list) {
          const map = {};
          const ensure = (n) => (map[n] || (map[n] = { name: n, jogos: 0, days: new Set(), faltaDays: new Set() }));
          const add = (names, dayKey) => (names || []).forEach(n => {
            const s = ensure(n); s.jogos++; if (dayKey) s.days.add(dayKey);
          });
          const addFalta = (names, dayKey) => (names || []).forEach(n => {
            const s = ensure(n); if (dayKey) s.faltaDays.add(dayKey);
          });
          for (const m of (list || [])) {
            const dayKey = (m.date || '').split(' ')[0]; // data sem a hora
            add(m.preto, dayKey); add(m.vermelho, dayKey); addFalta(m.faltas, dayKey);
          }
          const arr = Object.values(map).map(s => ({ name: s.name, jogos: s.jogos, dias: s.days.size, faltas: s.faltaDays.size }));
          arr.sort((a, b) => b.dias - a.dias || a.faltas - b.faltas || b.jogos - a.jogos || a.name.localeCompare(b.name));
          return arr;
        }
        const attendanceView = Vue.computed(() => computeAttendance(rankingMatches.value));

        // ---- Cloud sync functions ----
        let cloudPushTimer = null;
        function snapshotBlob() {
          return {
            players: players.value,
            blocks: blocks.value,
            history: history.value,
            matches: matches.value,
            lastDraw: { id: currentDrawId.value, preto: teamPreto.value, vermelho: teamVermelho.value }
          };
        }
        function pushCloud() {
          const fb = window.GaloSync;
          if (!fb || !fb.ready || !cloudEnabled.value || !canEdit.value || !editCode.value) return;
          clearTimeout(cloudPushTimer);
          cloudPushTimer = setTimeout(() => {
            fb.save(currentDay.value, { ...snapshotBlob(), editCode: editCode.value })
              .catch((e) => console.warn('[sync] gravacao:', e && e.code));
          }, 400);
        }
        function applyRemote(data) {
          if (!data) return;
          // Seguranca: nao sobrescreve dados locais com um remoto vazio (evita apagar tudo)
          const remoteEmpty = !(data.players && data.players.length) &&
                              !(data.history && data.history.length) &&
                              !(data.matches && data.matches.length);
          const localHasData = players.value.length || history.value.length || matches.value.length;
          if (remoteEmpty && localHasData) { if (canEdit.value) pushCloud(); return; }
          applyingRemote = true;
          players.value = Array.isArray(data.players) ? data.players.map(migratePlayer) : [];
          blocks.value = Array.isArray(data.blocks) ? data.blocks : [];
          history.value = Array.isArray(data.history) ? data.history : [];
          matches.value = Array.isArray(data.matches) ? data.matches : [];
          const ld = data.lastDraw;
          teamPreto.value = ld && Array.isArray(ld.preto) ? ld.preto : [];
          teamVermelho.value = ld && Array.isArray(ld.vermelho) ? ld.vermelho : [];
          currentDrawId.value = ld && ld.id ? ld.id : null;
          saveCurrentDay(); // cache local
          Vue.nextTick(() => { applyingRemote = false; });
        }
        function subscribeCloud() {
          const fb = window.GaloSync;
          if (!fb || !fb.ready) return;
          if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
          const day = currentDay.value;
          cloudUnsub = fb.subscribe(day, (data) => {
            if (day !== currentDay.value) return; // trocou de dia enquanto o dado chegava
            if (!cloudEnabled.value) {            // 1a conexao bem-sucedida: ativa a nuvem
              cloudEnabled.value = true;
              canEdit.value = !!editCode.value;   // sem codigo salvo -> somente leitura
            }
            syncStatus.value = 'online';
            if (data) applyRemote(data);
            else if (canEdit.value) pushCloud();  // nuvem vazia e posso escrever -> semeia com o local
          }, (err) => {
            // Leitura falhou (regras ou banco ausente) -> segue em modo local editavel
            cloudEnabled.value = false;
            canEdit.value = true;
            syncStatus.value = 'erro';
          });
        }
        function initCloud() {
          const fb = window.GaloSync;
          if (!fb || !fb.ready) { syncStatus.value = 'local'; return; }
          syncStatus.value = 'conectando';
          // Nao trava em leitura ainda: so ativa a nuvem quando uma leitura funcionar (subscribeCloud)
          subscribeCloud();
        }
        function unlockEdit() {
          const fb = window.GaloSync;
          if (!fb || !fb.ready) { alert('Sincronizacao indisponivel no momento.'); return; }
          const code = (prompt('Codigo de edicao:') || '').trim();
          if (!code) return;
          // Verifica o codigo tentando gravar o dia atual com ele
          fb.save(currentDay.value, { ...snapshotBlob(), editCode: code })
            .then(() => {
              editCode.value = code;
              localStorage.setItem('sorteio_editcode', code);
              canEdit.value = true;
            })
            .catch(() => alert('Codigo incorreto.'));
        }
        function lockEdit() {
          editCode.value = '';
          localStorage.removeItem('sorteio_editcode');
          canEdit.value = false;
        }
        function requireEdit() {
          if (cloudEnabled.value && !canEdit.value) {
            alert('Somente leitura. Toque em "Liberar edicao" e informe o codigo 3352.');
            return false;
          }
          return true;
        }
        // Liga a nuvem quando o modulo Firebase estiver pronto
        if (window.GaloSync) initCloud();
        else window.addEventListener('galosync-ready', initCloud);

        return {
          currentDay, switchDay, dayLabels: DAY_LABELS, days: DAYS,
          cloudEnabled, canEdit, syncStatus, unlockEdit, lockEdit,
          activeTab, timesTab, rankingScope, rankingMetric, elencoSearch, showAdd, showBlocks, nowLabel,
          newGoalkeeper, toggleGoalkeeper, toggleNaLinha, keeperRegulars,
          showFaltas, faltosos, toggleFaltou,
          confPct, confBase, confGuests, faltam, otherDayName, otherDayPlayers,
          filteredElenco, standingsView, attendanceView, fmtAvg, teamAvg, starsOn, starsOff, readOnly,
          incScore, decScore, winLabel, winColor, realIndex, goAddGuest, copyPlayer, copyTeams, copyMsg,
          players, newName, newRatings, teamPreto, teamVermelho, teamPretoView, teamVermelhoView,
          editingIndex, editRatings, history, swapFrom, drawModified,
          blocks, blockPlayer1, blockPlayer2, availableBlockPlayers, activePlayers,
          newGuest, confirmedPlayers, confirmedGuests,
          baseRegulars, baseSorted, baseTeamPreto, baseTeamVermelho, unassignedRegulars, matchPlayerCount,
          matches, scorePreto, scoreVermelho, sessionRecord, mustResort, standings,
          categories: CATEGORIES,
          addPlayer, removePlayer, clearGuests, toggleActive, toggleEdit, saveRatings,
          toggleConfirm, confirmAll, newDay,
          addBlock, removeBlock, selectSwap, saveModifiedDraw, clearHistory, removeHistory,
          sortBaseTeams, generateMatchTeams, restoreBase,
          registerMatch, removeMatch, clearMatches,
          exportData, importData
        };
      }
    }).mount('#app');
  </script>
</body>
