<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Patota Galo Tito</title>
  <!-- PWA: instalar na tela inicial -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#08080a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Galo Tito">
  <link rel="apple-touch-icon" href="icons/apple-touch-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Sincronizacao entre aparelhos (Firebase Firestore). Falha aqui = app funciona so com localStorage. -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCtN8z_v0aFT89vDM6N551UhkX__gpmp9M",
      authDomain: "galo-tito.firebaseapp.com",
      projectId: "galo-tito",
      storageBucket: "galo-tito.firebasestorage.app",
      messagingSenderId: "911479522159",
      appId: "1:911479522159:web:ce06de2400a4b8672c5e9a"
    };

    const api = { ready: false };
    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      // Leitura aberta em tempo real; ignora o eco das nossas proprias gravacoes locais.
      api.subscribe = (day, cb, onErr) => onSnapshot(doc(db, "patotas", day),
        (snap) => { if (snap.metadata.hasPendingWrites) return; cb(snap.exists() ? snap.data() : null); },
        (err) => { console.warn("[sync] leitura:", err && err.code); if (onErr) onErr(err); });
      // Gravacao (retorna promessa; as regras exigem o editCode correto).
      api.save = (day, data) => setDoc(doc(db, "patotas", day), { ...data, updatedAt: Date.now() });
      api.ready = true;
    } catch (e) {
      console.warn("[sync] Firebase indisponivel, usando so localStorage:", e);
    }
    window.GaloSync = api;
    window.dispatchEvent(new Event("galosync-ready"));
  </script>
  <style>
    :root {
      --bg: #08080a;
      --app: #0b0b0d;
      --card: #141417;
      --card2: #1c1c21;
      --line: #26262c;
      --line2: #4a4a52;
      --red: #f0272e;
      --red-soft: rgba(240,39,46,0.14);
      --red-soft-b: #f0272e;
      --red-text: #ffc9cc;
      --gold: #f0b050;
      --green: #3fa84a;
      --green-soft: rgba(63,168,74,0.16);
      --green-text: #bfe6c3;
      --info: #6fb7e8;
      --t1: #f5f5f5;
      --t2: #e8e8ea;
      --t3: #b9b9be;
      --t4: #85858c;
      --t5: #5a5a61;
      --off: #3a3a40;
      --disp: 'Bebas Neue', sans-serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--t1);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; }
    input, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 8px; }

    /* App shell */
    .container {
      max-width: 460px;
      height: 100dvh;
      margin: 0 auto;
      background: var(--app);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .app-header { flex: none; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 10px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 30px; height: auto; display: block; }
    .brand-name { font-family: var(--disp); font-size: 18px; letter-spacing: 0.08em; color: var(--t3); flex: 1; }
    .lock-btn {
      background: var(--card2); color: var(--t3); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .lock-btn.editing { color: var(--green); border-color: rgba(63,168,74,0.5); }
    .lock-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
    .lock-btn.editing .lock-dot { background: var(--green); }

    .day-pills { display: flex; gap: 4px; background: var(--card2); border-radius: 999px; padding: 4px; }
    .day-pills button {
      flex: 1; background: transparent; color: var(--t4); border-radius: 999px;
      padding: 10px; font-size: 14px; font-weight: 700;
    }
    .day-pills button.on { background: var(--red); color: #fff; }

    /* Main scroll area */
    .app-main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
    .app-main.locked { opacity: 0.94; }
    .app-main.locked .lockable { pointer-events: none; }

    /* Bottom nav */
    .app-nav { flex: none; display: flex; background: #101013; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
    .app-nav button {
      flex: 1; background: transparent; padding: 11px 2px 16px; text-align: center;
      border-top: 2px solid transparent; font-size: 11px; color: var(--t4); font-weight: 500; letter-spacing: 0.04em;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .app-nav button .ico { font-size: 17px; line-height: 1; }
    .app-nav button.on { color: var(--red); font-weight: 700; border-top-color: var(--red); background: var(--card); }

    /* Common */
    .screen-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .screen-title h1 { font-family: var(--disp); font-size: 30px; line-height: 1; letter-spacing: 0.02em; font-weight: 400; }
    .screen-sub { font-size: 12px; color: var(--t4); }
    .card { background: var(--card); border-radius: 16px; padding: 16px; }
    .muted { color: var(--t4); }
    .label-cap { font-size: 12px; color: var(--t4); letter-spacing: 0.06em; }
    .empty { text-align: center; color: var(--t5); padding: 24px 10px; font-size: 14px; }

    .btn-primary { background: var(--red); color: #fff; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 700; width: 100%; }
    .btn-primary:disabled { opacity: 0.4; }
    .btn-ghost { background: var(--card2); color: var(--t1); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 500; }
    .btn-ghost.sm { padding: 10px 14px; font-size: 13px; }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 600; }
    .btn-pulse { animation: pulseAlert 1.4s infinite; }
    @keyframes pulseAlert { 0%,100% { opacity: 1; } 50% { opacity: 0.62; } }

    /* Alert (2 vitorias) */
    .alert-box { background: var(--red-soft); border: 1px solid var(--red-soft-b); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .alert-box .txt { font-size: 14px; color: var(--red-text); line-height: 1.45; }

    /* Confirm summary card (Hoje) */
    .conf-card { display: flex; align-items: center; gap: 16px; }
    .conf-num { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 74px; }
    .conf-num .n { font-family: var(--disp); font-size: 44px; line-height: 1; color: var(--green); }
    .conf-num .l { font-size: 11px; color: var(--t4); letter-spacing: 0.06em; }
    .conf-right { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .bar > i { display: block; height: 8px; background: var(--green); border-radius: 999px; }
    .conf-break { font-size: 13px; color: var(--t3); }
    .conf-actions { display: flex; gap: 8px; }
    .conf-actions button { flex: 1; }

    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .link-red { font-size: 13px; color: var(--red); font-weight: 500; background: none; }

    /* Presence / player rows */
    .prow { display: flex; align-items: center; gap: 12px; background: var(--card2); border-radius: 10px; padding: 9px 14px; min-height: 52px; border-left: 3px solid transparent; }
    .prow.on { border-left-color: var(--green); }
    .prow.injured { opacity: 0.5; }
    .pcheck { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0; border: 2px solid var(--line2); background: transparent; }
    .pcheck.on { background: var(--green); border-color: var(--green); }
    .pname { flex: 1; font-size: 16px; font-weight: 500; color: var(--t3); }
    .prow.on .pname { color: var(--t1); }
    .prow.injured .pname { text-decoration: line-through; color: var(--t4); }
    .pavg { font-family: var(--disp); font-size: 18px; letter-spacing: 0.02em; min-width: 26px; text-align: right; color: var(--t5); }
    .prow.on .pavg { color: var(--gold); }
    .tag { font-size: 11px; border-radius: 6px; padding: 2px 7px; white-space: nowrap; border: 1px solid currentColor; }
    .tag.conv { color: var(--gold); }
    .tag.extra { color: var(--info); }
    .tag.injured { color: var(--t4); }
    .tag.falta { color: var(--red); }
    .tag.gol { color: var(--green); }
    .glove { margin-right: 5px; }
    .btn-share {
      width: 100%; background: #25d366; color: #06331a; border-radius: 12px;
      padding: 14px; font-size: 15px; font-weight: 700; margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-share:hover { filter: brightness(1.05); }
    .copy-msg { text-align: center; font-size: 13px; color: var(--green); margin-top: -4px; }
    .falta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      background: var(--card2); color: var(--t3); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 12px; font-size: 13px;
    }
    .chip.faltou { background: var(--red-soft); border-color: var(--red); color: var(--red-text); text-decoration: line-through; }
    .tag-xs.gol { color: var(--green); }
    .linha-btn {
      font-size: 11px; border-radius: 999px; padding: 3px 9px; white-space: nowrap;
      border: 1px solid var(--line2); background: transparent; color: var(--t4);
    }
    .linha-btn.on { border-color: var(--info); color: var(--info); background: rgba(111,183,232,0.12); }
    .ricon.gk { color: var(--green); }
    .ricon.gk.off { color: var(--t5); filter: grayscale(1); opacity: 0.5; }

    /* Sub tabs */
    .subtabs { display: flex; gap: 4px; background: var(--card); border-radius: 999px; padding: 4px; }
    .subtabs button { flex: 1; background: transparent; color: var(--t4); border-radius: 999px; padding: 9px; font-size: 13px; font-weight: 700; }
    .subtabs button.on { background: var(--line); color: var(--t1); }

    /* Info banners */
    .banner-green { background: var(--green-soft); border: 1px solid var(--green); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--green-text); line-height: 1.4; }
    .note-box { background: var(--card); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .note-box .ico-badge { width: 30px; height: 30px; border-radius: 8px; background: var(--line); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .note-row { display: flex; align-items: center; gap: 12px; }
    .note-row .txt { flex: 1; font-size: 13px; color: var(--t3); line-height: 1.4; }

    /* Teams */
    .teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .teamcard { border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .teamcard.preto { background: #101013; border: 1px solid var(--line2); }
    .teamcard.vermelho { background: #2a0708; border: 1px solid var(--red); }
    .teamcard .thead { display: flex; align-items: baseline; justify-content: space-between; }
    .teamcard .tname { font-family: var(--disp); font-size: 22px; letter-spacing: 0.02em; }
    .teamcard.vermelho .tname { color: var(--red); }
    .teamcard .tavg { font-family: var(--disp); font-size: 16px; color: var(--gold); }
    .teamcard ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .teamcard li { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--t2); padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
    .teamcard li:last-child { border-bottom: none; }
    .teamcard li .nm { flex: 1; }
    .teamcard li.sel { background: rgba(240,39,46,0.18); border-radius: 6px; padding-left: 6px; padding-right: 6px; }
    .teamcard li.faint { opacity: 0.45; }
    .tag-xs { font-size: 10px; border-radius: 5px; padding: 1px 5px; border: 1px solid currentColor; }
    .tag-xs.conv { color: var(--gold); }
    .tag-xs.extra { color: var(--info); }
    .tag-xs.falta { color: var(--red); }

    /* Placar */
    .score-panel { display: flex; flex-direction: column; gap: 16px; }
    .score-cols { display: flex; align-items: flex-start; justify-content: center; gap: 14px; }
    .score-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .score-team { font-family: var(--disp); font-size: 16px; letter-spacing: 0.06em; color: var(--t3); }
    .score-col.v .score-team { color: var(--red); }
    .score-big { font-family: var(--disp); font-size: 56px; line-height: 0.9; }
    .score-btns { display: flex; gap: 8px; width: 100%; }
    .score-btns button { flex: 1; background: var(--card2); color: var(--t1); border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; min-height: 48px; font-size: 22px; }
    .score-x { font-family: var(--disp); font-size: 28px; color: var(--t5); padding-top: 26px; }
    .round-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .round-line .v { font-family: var(--disp); font-size: 22px; letter-spacing: 0.02em; }
    .match-item2 { background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .match-item2 .top { display: flex; align-items: center; gap: 10px; }
    .match-item2 .tm { font-family: var(--disp); font-size: 15px; letter-spacing: 0.04em; flex: 1; color: var(--t4); }
    .match-item2 .tm.r { text-align: right; }
    .match-item2 .sc { font-family: var(--disp); font-size: 24px; letter-spacing: 0.02em; }
    .match-item2 .bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .match-item2 .dt { font-size: 12px; color: var(--t5); }
    .del-x { background: none; color: var(--red); font-size: 18px; padding: 0 4px; line-height: 1; }

    /* Ranking table */
    .rank { background: var(--card); border-radius: 18px; overflow: hidden; }
    .rank .rhead, .rank .rrow { display: grid; grid-template-columns: 26px 1fr 30px 30px 30px 42px; gap: 4px; padding: 11px 14px; align-items: center; }
    .rank.att .rhead, .rank.att .rrow { grid-template-columns: 24px 1fr 44px 44px 50px; }
    .rank .rhead { font-size: 11px; color: var(--t4); letter-spacing: 0.06em; border-bottom: 1px solid rgba(255,255,255,0.09); }
    .rank .rrow { font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .rank .rrow:last-child { border-bottom: none; }
    .rank .pos { font-family: var(--disp); font-size: 18px; color: var(--t5); }
    .rank .rrow:first-child .pos { color: var(--gold); }
    .rank .nm { font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .rank .c { text-align: center; color: var(--t3); }
    .rank .v { text-align: center; color: var(--green); font-weight: 700; }
    .rank .d { text-align: center; color: var(--t4); }
    .rank .pts { text-align: right; font-family: var(--disp); font-size: 18px; color: var(--t2); }
    .rank .rrow:first-child .pts { color: var(--gold); }
    .summary-card { background: var(--card); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .summary-card .sr { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--t3); }

    /* Elenco */
    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; background: var(--card2); border-radius: 12px; padding: 13px 14px; font-size: 14px; color: var(--t1); border: none; outline: none; }
    .search-row input::placeholder { color: var(--t5); }
    .search-row .add-btn { flex: none; background: var(--red); color: #fff; border-radius: 12px; padding: 0 18px; font-size: 22px; font-weight: 700; }
    .erow { display: flex; align-items: center; gap: 12px; background: var(--card2); border-radius: 10px; padding: 10px 14px; min-height: 52px; cursor: pointer; }
    .erow .pname { color: var(--t1); }
    .stars { font-size: 15px; letter-spacing: 2px; white-space: nowrap; }
    .stars .on { color: var(--gold); }
    .stars .off { color: var(--off); }
    .erow .pavg { color: var(--gold); }
    .row-actions { display: flex; gap: 6px; }
    .ricon { background: none; font-size: 15px; padding: 4px 6px; line-height: 1; }
    .ricon.edit { color: var(--gold); }
    .ricon.injury { color: var(--green); }
    .ricon.injury.off { color: var(--t4); }
    .ricon.del { color: var(--red); }

    /* Add / edit forms */
    .form-card { background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .form-card input[type=text] { background: var(--card2); border-radius: 10px; padding: 12px 14px; font-size: 15px; color: var(--t1); border: none; outline: none; width: 100%; }
    .rate-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .rate-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .rate-row .rl { font-size: 13px; color: var(--t3); }
    .rate-stars { font-size: 22px; letter-spacing: 4px; white-space: nowrap; cursor: pointer; }
    .rate-stars .on { color: var(--gold); }
    .rate-stars .off { color: var(--off); }
    .guest-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t3); }
    .guest-check input { width: 16px; height: 16px; accent-color: var(--red); }

    /* Blocks */
    .block-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .block-form select { flex: 1; min-width: 110px; background: var(--card2); border-radius: 10px; padding: 10px; font-size: 13px; color: var(--t1); border: none; }
    .block-item { display: flex; align-items: center; justify-content: space-between; background: var(--card2); border-radius: 10px; padding: 8px 14px; font-size: 13px; color: var(--t3); }
    .cp-select { width: 100%; background: var(--card2); border: none; border-radius: 10px; padding: 11px 12px; color: var(--t1); font-size: 14px; outline: none; }

    /* History */
    .hist-item { background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .hist-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; }
    .hist-teams h4 { font-family: var(--disp); font-size: 14px; letter-spacing: 0.02em; font-weight: 400; margin-bottom: 3px; }
    .hist-teams ul { list-style: none; color: var(--t3); }
    .hist-teams li { padding: 1px 0; }
    .btn-restore { background: var(--card2); border: 1px solid var(--line2); color: var(--info); border-radius: 10px; padding: 9px; font-size: 12px; font-weight: 600; width: 100%; }

    .swap-hint2 { text-align: center; font-size: 12px; color: var(--gold); background: rgba(240,176,80,0.08); border-radius: 8px; padding: 8px; }
    .toolbar-2 { display: flex; gap: 8px; }
    .toolbar-2 label, .toolbar-2 button { flex: 1; text-align: center; }
    .toolbar-2 input[type=file] { display: none; }

    /* 2-col lists helper (used on desktop) */
    .list { display: flex; flex-direction: column; gap: 6px; }

    /* Desktop: aproveitar a largura */
    @media (min-width: 760px) {
      .container { max-width: 760px; }
      .app-main { padding: 22px 30px 28px; }
      .app-nav button { padding: 14px 2px 18px; font-size: 12px; }
      .screen-title h1 { font-size: 36px; }
      .list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .teams-grid { gap: 16px; }
      .rank .rhead, .rank .rrow { grid-template-columns: 30px 1fr 40px 40px 40px 52px; }
    }
    @media (min-width: 1100px) {
      .container { max-width: 900px; }
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <header class="app-header">
      <div class="brand">
        <img src="assets/escudo-galo-tito.png" alt="Escudo Galo Tito">
        <span class="brand-name">PATOTA GALO TITO</span>
        <button v-if="cloudEnabled" class="lock-btn" :class="{ editing: canEdit }" @click="canEdit ? lockEdit() : unlockEdit()">
          <span class="lock-dot"></span>{{ canEdit ? 'Editando' : 'Só leitura' }}
        </button>
      </div>
      <div class="day-pills">
        <button v-for="d in days" :key="d" :class="{ on: currentDay === d }" @click="switchDay(d)">{{ dayLabels[d] }}</button>
      </div>
    </header>

    <main class="app-main" :class="{ locked: cloudEnabled && !canEdit }">

      <!-- ===================== HOJE ===================== -->
      <template v-if="activeTab === 'hoje'">
        <div class="screen-title"><h1>Hoje</h1><span class="screen-sub">{{ nowLabel }}</span></div>

        <div v-if="mustResort" class="alert-box lockable">
          <div class="txt">Um time venceu 2 vezes nesta rodada. Sorteie o time base para liberar a próxima partida.</div>
          <button class="btn-primary btn-pulse" @click="sortBaseTeams">Sortear time base</button>
        </div>

        <div class="card conf-card">
          <div class="conf-num"><span class="n">{{ confirmedPlayers.length }}</span><span class="l">CONFIRMADOS</span></div>
          <div class="conf-right">
            <div class="bar"><i :style="{ width: confPct + '%' }"></i></div>
            <div class="conf-break">{{ confBase }} da base · {{ confGuests }} conv. · {{ faltam }} faltam</div>
            <div class="conf-actions lockable">
              <button class="btn-ghost sm" @click="goAddGuest">+ Convidado</button>
              <button class="btn-ghost sm" @click="newDay">Novo dia</button>
            </div>
          </div>
        </div>

        <div class="row-between">
          <span class="label-cap">PRESENÇA</span>
          <button class="link-red lockable" @click="confirmAll">Confirmar todos</button>
        </div>

        <div class="list lockable" v-if="players.length">
          <div v-for="(p, i) in players" :key="i" class="prow" :class="{ on: p.confirmed && p.active, injured: !p.active }" @click="toggleConfirm(i)">
            <span class="pcheck" :class="{ on: p.confirmed && p.active }">{{ p.confirmed && p.active ? '✓' : '' }}</span>
            <span class="pname">{{ p.name }}</span>
            <span v-if="p.goalkeeper" class="tag gol">GOL</span>
            <span v-else-if="p.guest" class="tag conv">conv.</span>
            <span v-else-if="p.active && p.base !== 'preto' && p.base !== 'vermelho'" class="tag extra">extra</span>
            <span v-if="!p.active" class="tag injured">lesionado</span>
            <button v-if="p.goalkeeper && p.confirmed && p.active" class="linha-btn" :class="{ on: p.naLinha }" @click.stop="toggleNaLinha(i)">{{ p.naLinha ? 'na linha ✓' : 'na linha' }}</button>
            <span v-if="!readOnly" class="pavg">{{ fmtAvg(p.ratings) }}</span>
          </div>
        </div>
        <p v-else class="empty">Nenhum jogador. Cadastre no Elenco.</p>
      </template>

      <!-- ===================== TIMES ===================== -->
      <template v-if="activeTab === 'times'">
        <div class="screen-title"><h1>Times</h1></div>
        <div class="subtabs">
          <button :class="{ on: timesTab === 'partida' }" @click="timesTab = 'partida'">Da partida</button>
          <button :class="{ on: timesTab === 'base' }" @click="timesTab = 'base'">Base da rodada</button>
        </div>

        <template v-if="timesTab === 'base'">
          <button class="btn-primary lockable" :class="{ 'btn-pulse': mustResort }" @click="sortBaseTeams" :disabled="baseRegulars.length < 2">
            {{ baseSorted ? 'Sortear time base de novo' : 'Sortear time base' }} ({{ baseRegulars.length }})
          </button>
          <div v-if="baseSorted" class="teams-grid">
            <div class="teamcard preto">
              <div class="thead"><span class="tname">Base Preto</span><span class="tavg">{{ teamAvg(baseTeamPreto) }}</span></div>
              <ul><li v-for="p in baseTeamPreto" :key="p.name" :class="{ faint: !p.confirmed }"><span class="nm"><span v-if="p.goalkeeper" class="glove">🧤</span>{{ p.name }}</span><span v-if="!p.confirmed" class="tag-xs falta">falta</span></li></ul>
            </div>
            <div class="teamcard vermelho">
              <div class="thead"><span class="tname">Base Vermelho</span><span class="tavg">{{ teamAvg(baseTeamVermelho) }}</span></div>
              <ul><li v-for="p in baseTeamVermelho" :key="p.name" :class="{ faint: !p.confirmed }"><span class="nm"><span v-if="p.goalkeeper" class="glove">🧤</span>{{ p.name }}</span><span v-if="!p.confirmed" class="tag-xs falta">falta</span></li></ul>
            </div>
          </div>
          <p v-if="baseSorted && unassignedRegulars.length" class="screen-sub">Fora do time base: {{ unassignedRegulars.map(p=>p.name).join(', ') }} — se confirmados, entram como convidados na partida.</p>
          <button v-if="baseSorted" class="btn-share" @click="copyTeams">📋 Copiar times para o WhatsApp</button>
          <p v-if="copyMsg" class="copy-msg">{{ copyMsg }}</p>
        </template>

        <template v-else>
          <button class="btn-primary lockable" @click="generateMatchTeams" :disabled="!baseSorted || matchPlayerCount < 2">
            {{ teamPreto.length ? 'Gerar times de novo' : 'Gerar times da partida' }} ({{ matchPlayerCount }})
          </button>
          <p v-if="!baseSorted" class="screen-sub">Sorteie o time base primeiro (aba "Base da rodada").</p>
          <div v-if="teamPreto.length || teamVermelho.length" class="teams-grid">
            <div class="teamcard preto">
              <div class="thead"><span class="tname">Preto</span><span class="tavg">{{ teamAvg(teamPreto) }}</span></div>
              <ul><li v-for="p in teamPretoView" :key="p.name" :class="{ sel: swapFrom && swapFrom.team==='preto' && swapFrom.name===p.name }" @click="selectSwap('preto', p)"><span class="nm"><span v-if="p.goalkeeper" class="glove">🧤</span>{{ p.name }}</span><template v-if="!p.goalkeeper"><span v-if="p.guest" class="tag-xs conv">conv.</span><span v-else-if="p.floater" class="tag-xs extra">extra</span></template></li></ul>
            </div>
            <div class="teamcard vermelho">
              <div class="thead"><span class="tname">Vermelho</span><span class="tavg">{{ teamAvg(teamVermelho) }}</span></div>
              <ul><li v-for="p in teamVermelhoView" :key="p.name" :class="{ sel: swapFrom && swapFrom.team==='vermelho' && swapFrom.name===p.name }" @click="selectSwap('vermelho', p)"><span class="nm"><span v-if="p.goalkeeper" class="glove">🧤</span>{{ p.name }}</span><template v-if="!p.goalkeeper"><span v-if="p.guest" class="tag-xs conv">conv.</span><span v-else-if="p.floater" class="tag-xs extra">extra</span></template></li></ul>
            </div>
          </div>
          <div v-if="teamPreto.length" class="swap-hint2 lockable">{{ swapFrom ? 'Toque num jogador do outro time para trocar' : 'Toque em dois jogadores para trocar de time' }}</div>
          <button v-if="drawModified" class="btn-ghost lockable" @click="saveModifiedDraw">Salvar alterações</button>
          <button v-if="teamPreto.length" class="btn-share" @click="copyTeams">📋 Copiar times para o WhatsApp</button>
          <p v-if="copyMsg" class="copy-msg">{{ copyMsg }}</p>
        </template>
      </template>

      <!-- ===================== PLACAR ===================== -->
      <template v-if="activeTab === 'placar'">
        <div class="screen-title"><h1>Placar</h1><span class="screen-sub" v-if="teamPreto.length">Patota da {{ dayLabels[currentDay] }}</span></div>
        <p v-if="!teamPreto.length || !teamVermelho.length" class="empty">Gere os times da partida (aba Times) para registrar o placar.</p>
        <template v-else>
          <div class="card score-panel lockable">
            <div v-if="mustResort" class="alert-box">
              <div class="txt">Um time venceu 2 vezes. Sorteie o time base para liberar a próxima partida.</div>
              <button class="btn-primary btn-pulse" @click="sortBaseTeams">Sortear time base</button>
            </div>
            <template v-else>
              <div class="score-cols">
                <div class="score-col"><span class="score-team">PRETO</span><span class="score-big">{{ Number(scorePreto)||0 }}</span><div class="score-btns"><button @click="decScore('preto')">−</button><button @click="incScore('preto')">+</button></div></div>
                <span class="score-x">×</span>
                <div class="score-col v"><span class="score-team">VERMELHO</span><span class="score-big">{{ Number(scoreVermelho)||0 }}</span><div class="score-btns"><button @click="decScore('vermelho')">−</button><button @click="incScore('vermelho')">+</button></div></div>
              </div>
              <button class="btn-primary" @click="registerMatch">Registrar partida</button>
            </template>
          </div>
          <div class="card round-line">
            <span class="muted" style="font-size:13px">Rodada atual</span>
            <span class="v">{{ sessionRecord.preto }} <span style="color:var(--t5)">×</span> <span style="color:var(--red)">{{ sessionRecord.vermelho }}</span><span v-if="sessionRecord.empate" style="font-size:14px;color:var(--t4)"> · {{ sessionRecord.empate }} emp.</span></span>
          </div>

          <div class="card lockable">
            <button class="row-between" style="width:100%;background:none;color:inherit" @click="showFaltas = !showFaltas">
              <span class="label-cap">FALTOU? (marcou e não veio) {{ faltosos.length ? '· ' + faltosos.length : '' }}</span>
              <span class="muted" style="font-size:18px">{{ showFaltas ? '−' : '+' }}</span>
            </button>
            <div v-if="showFaltas" class="falta-chips">
              <button v-for="p in confirmedPlayers" :key="p.name" class="chip" :class="{ faltou: p.faltou }" @click="toggleFaltou(realIndex(p))">{{ p.name }}</button>
            </div>
            <p v-if="showFaltas" class="hint-small">Quem for marcado não conta como presente e vira "falta" no ranking ao registrar a partida.</p>
          </div>
        </template>

        <template v-if="matches.length">
          <span class="label-cap">ÚLTIMAS PARTIDAS</span>
          <div class="list">
            <div v-for="(m,i) in matches" :key="i" class="match-item2">
              <div class="top">
                <span class="tm" :style="{ color: m.winner==='preto' ? 'var(--t1)' : 'var(--t4)' }">PRETO</span>
                <span class="sc">{{ m.scorePreto }} × {{ m.scoreVermelho }}</span>
                <span class="tm r" :style="{ color: m.winner==='vermelho' ? 'var(--red)' : 'var(--t4)' }">VERMELHO</span>
              </div>
              <div class="bot">
                <span class="dt">{{ m.date }}</span>
                <span style="display:flex;align-items:center;gap:8px">
                  <span class="tag-xs" :style="{ color: winColor(m.winner) }">{{ winLabel(m.winner) }}</span>
                  <button class="del-x lockable" @click="removeMatch(i)">×</button>
                </span>
              </div>
            </div>
          </div>
        </template>
      </template>

      <!-- ===================== RANKING ===================== -->
      <template v-if="activeTab === 'ranking'">
        <div class="screen-title"><h1>Ranking</h1><span class="screen-sub">{{ (rankingMetric==='presenca' ? attendanceView : standingsView).length }} jogadores</span></div>
        <div class="subtabs">
          <button :class="{ on: rankingMetric==='pontos' }" @click="rankingMetric='pontos'">Pontos</button>
          <button :class="{ on: rankingMetric==='presenca' }" @click="rankingMetric='presenca'">Presença</button>
        </div>
        <div class="subtabs">
          <button :class="{ on: rankingScope==='segunda' }" @click="rankingScope='segunda'">Segunda</button>
          <button :class="{ on: rankingScope==='quarta' }" @click="rankingScope='quarta'">Quarta</button>
          <button :class="{ on: rankingScope==='somado' }" @click="rankingScope='somado'">Somado</button>
        </div>

        <div class="rank" v-if="rankingMetric==='pontos' && standingsView.length">
          <div class="rhead"><span>#</span><span>JOGADOR</span><span class="c">J</span><span class="c">V</span><span class="c">D</span><span style="text-align:right">PTS</span></div>
          <div class="rrow" v-for="(s,i) in standingsView" :key="s.name">
            <span class="pos">{{ i+1 }}</span>
            <span class="nm">{{ s.name }}</span>
            <span class="c">{{ s.jogos }}</span>
            <span class="v">{{ s.vitorias }}</span>
            <span class="d">{{ s.derrotas }}</span>
            <span class="pts">{{ s.pontos }}</span>
          </div>
        </div>

        <div class="rank att" v-else-if="rankingMetric==='presenca' && attendanceView.length">
          <div class="rhead"><span>#</span><span>JOGADOR</span><span class="c">JOGOS</span><span class="c">DIAS</span><span style="text-align:right">FALTAS</span></div>
          <div class="rrow" v-for="(s,i) in attendanceView" :key="s.name">
            <span class="pos">{{ i+1 }}</span>
            <span class="nm">{{ s.name }}</span>
            <span class="c">{{ s.jogos }}</span>
            <span class="v">{{ s.dias }}</span>
            <span class="d" style="text-align:right">{{ s.faltas || '-' }}</span>
          </div>
        </div>

        <p v-else class="empty">Sem partidas registradas ainda.</p>
      </template>

      <!-- ===================== ELENCO ===================== -->
      <template v-if="activeTab === 'elenco'">
        <div class="screen-title"><h1>Elenco</h1><span class="screen-sub">{{ baseRegulars.length }} reg. · {{ players.filter(p=>p.guest).length }} conv.</span></div>
        <div class="search-row">
          <input type="text" v-model="elencoSearch" placeholder="Buscar jogador">
          <button class="add-btn lockable" @click="showAdd = !showAdd">+</button>
        </div>

        <div v-if="showAdd" class="form-card lockable">
          <input type="text" v-model.trim="newName" placeholder="Nome do jogador">
          <div class="rate-grid">
            <div class="rate-row" v-for="cat in categories" :key="cat.key">
              <span class="rl">{{ cat.label }}</span>
              <span class="rate-stars"><span v-for="n in 5" :key="n" :class="n <= newRatings[cat.key] ? 'on' : 'off'" @click="newRatings[cat.key]=n">★</span></span>
            </div>
          </div>
          <label class="guest-check"><input type="checkbox" v-model="newGuest"> Convidado (jogador de fora)</label>
          <label class="guest-check"><input type="checkbox" v-model="newGoalkeeper"> Goleiro</label>
          <button class="btn-primary" @click="addPlayer(); showAdd=false">Adicionar</button>
        </div>

        <div v-if="otherDayPlayers.length" class="note-box lockable">
          <div class="note-row"><span class="ico-badge">↔</span><span class="txt">Copiar jogador da patota da {{ dayLabels[otherDayName] }} (traz as notas).</span></div>
          <select class="cp-select" @change="copyPlayer($event.target.value); $event.target.value=''">
            <option value="">Escolher jogador da {{ dayLabels[otherDayName] }}…</option>
            <option v-for="p in otherDayPlayers" :key="p.name" :value="p.name">{{ p.name }}</option>
          </select>
        </div>

        <div class="list" v-if="filteredElenco.length">
          <template v-for="p in filteredElenco" :key="p.name">
            <div class="erow" @click="toggleEdit(realIndex(p))">
              <span class="pname" :style="!p.active ? 'text-decoration:line-through;color:var(--t4)' : ''">{{ p.name }}</span>
              <span v-if="p.goalkeeper" class="tag gol">GOL</span>
              <span v-if="p.guest" class="tag conv">conv.</span>
              <span v-if="!p.active" class="tag injured">lesionado</span>
              <span v-if="!readOnly" class="stars"><span class="on">{{ starsOn(p.ratings) }}</span><span class="off">{{ starsOff(p.ratings) }}</span></span>
              <span v-if="!readOnly" class="pavg">{{ fmtAvg(p.ratings) }}</span>
              <span class="row-actions lockable" @click.stop>
                <button class="ricon gk" :class="{ off: !p.goalkeeper }" title="Goleiro" @click="toggleGoalkeeper(realIndex(p))">🧤</button>
                <button class="ricon injury" :class="{ off: !p.active }" @click="toggleActive(realIndex(p))">{{ p.active ? '✓' : '✗' }}</button>
                <button class="ricon del" @click="removePlayer(realIndex(p))">×</button>
              </span>
            </div>
            <div v-if="editingIndex === realIndex(p) && !readOnly" class="form-card lockable">
              <div class="label-cap">NOTAS DE {{ p.name.toUpperCase() }}</div>
              <div class="rate-grid">
                <div class="rate-row" v-for="cat in categories" :key="cat.key">
                  <span class="rl">{{ cat.label }}</span>
                  <span class="rate-stars"><span v-for="n in 5" :key="n" :class="n <= editRatings[cat.key] ? 'on' : 'off'" @click="editRatings[cat.key]=n">★</span></span>
                </div>
              </div>
              <button class="btn-primary" @click="saveRatings(realIndex(p))">Salvar notas</button>
            </div>
          </template>
        </div>
        <p v-else class="empty">Nenhum jogador encontrado.</p>

        <div class="toolbar-2 lockable">
          <button class="btn-ghost sm" @click="showBlocks = !showBlocks">Bloqueios ({{ blocks.length }})</button>
          <button class="btn-ghost sm" @click="exportData">Exportar</button>
          <label class="btn-ghost sm"><input type="file" accept="application/json,.json" @change="importData">Importar</label>
        </div>

        <div v-if="showBlocks" class="form-card lockable">
          <div class="label-cap">BLOQUEIOS (não jogam juntos)</div>
          <div class="block-form">
            <select v-model="blockPlayer1"><option value="">Jogador 1</option><option v-for="p in baseRegulars" :key="p.name" :value="p.name">{{ p.name }}</option></select>
            <span style="color:var(--t5)">×</span>
            <select v-model="blockPlayer2"><option value="">Jogador 2</option><option v-for="p in availableBlockPlayers" :key="p.name" :value="p.name">{{ p.name }}</option></select>
            <button class="btn-ghost sm" style="flex:none;padding:10px 14px" @click="addBlock" :disabled="!blockPlayer1 || !blockPlayer2">+</button>
          </div>
          <div class="block-item" v-for="(b,i) in blocks" :key="i"><span>{{ b[0] }} × {{ b[1] }}</span><button class="del-x" @click="removeBlock(i)">×</button></div>
        </div>

        <template v-if="history.length">
          <span class="label-cap">HISTÓRICO DE SORTEIOS</span>
          <div class="list">
            <div class="hist-item" v-for="(h,i) in history" :key="i">
              <div class="row-between"><span style="font-size:12px;color:var(--t5)">{{ h.date }}</span><button class="del-x lockable" @click="removeHistory(i)">×</button></div>
              <div class="hist-teams">
                <div><h4 style="color:var(--t3)">Preto</h4><ul><li v-for="n in h.preto" :key="n">{{ n }}</li></ul></div>
                <div><h4 style="color:var(--red)">Vermelho</h4><ul><li v-for="n in h.vermelho" :key="n">{{ n }}</li></ul></div>
              </div>
              <button class="btn-restore lockable" @click="restoreBase(h)">↻ Usar esta base</button>
            </div>
          </div>
        </template>
      </template>

    </main>

    <nav class="app-nav">
      <button :class="{ on: activeTab==='hoje' }" @click="activeTab='hoje'"><span class="ico">📋</span>HOJE</button>
      <button :class="{ on: activeTab==='times' }" @click="activeTab='times'"><span class="ico">🧩</span>TIMES</button>
      <button :class="{ on: activeTab==='placar' }" @click="activeTab='placar'"><span class="ico">⚽</span>PLACAR</button>
      <button :class="{ on: activeTab==='ranking' }" @click="activeTab='ranking'"><span class="ico">🏆</span>RANKING</button>
      <button :class="{ on: activeTab==='elenco' }" @click="activeTab='elenco'"><span class="ico">👥</span>ELENCO</button>
    </nav>
  </div>

  <script>
    const { createApp, ref, reactive, watch } = Vue;

    const CATEGORIES = [
      { key: 'geral', label: 'Geral' },
      { key: 'fisico', label: 'Cond. Fisico' },
      { key: 'finalizacao', label: 'Finalizacao' },
      { key: 'visao', label: 'Visao de Jogo' },
    ];

    function defaultRatings() {
      return { geral: 3, fisico: 3, finalizacao: 3, visao: 3 };
    }

    // Media das 4 categorias (Fominha foi removida; ignorada em dados antigos)
    function avgRating(r) {
      return (r.geral + r.fisico + r.finalizacao + r.visao) / 4;
    }

    // How many players stayed on the "same" side vs the previous base draw
    // (label-independent: takes the best of the two alignments). Lower = more change.
    function overlapCount(a, b, prevA, prevB) {
      if (!prevA.length && !prevB.length) return 0;
      const pA = new Set(prevA), pB = new Set(prevB);
      const countIn = (set, arr) => arr.reduce((n, p) => n + (set.has(p.name) ? 1 : 0), 0);
      const o1 = countIn(pA, a) + countIn(pB, b);
      const o2 = countIn(pB, a) + countIn(pA, b);
      return Math.max(o1, o2);
    }

    // Migrate old players that only have a single "rating" field
    function migratePlayer(p) {
      if (p.ratings) {
        if (p.active === undefined) p.active = true;
        if (p.confirmed === undefined) p.confirmed = false;
        if (p.guest === undefined) p.guest = false;
        if (p.base === undefined) p.base = null;
        if (p.goalkeeper === undefined) p.goalkeeper = false;
        if (p.naLinha === undefined) p.naLinha = false;
        if (p.faltou === undefined) p.faltou = false;
        return p;
      }
      const old = p.rating || 3;
      return {
        name: p.name,
        active: true,
        confirmed: false,
        guest: false,
        base: null,
        goalkeeper: false,
        naLinha: false,
        faltou: false,
        ratings: { geral: old, fisico: 3, finalizacao: 3, visao: 3 }
      };
    }

    // Each "patota" (day) keeps its own separate dataset under namespaced keys.
    const DAYS = ['segunda', 'quarta'];
    const DAY_LABELS = { segunda: 'Segunda', quarta: 'Quarta' };
    const STORE_NAMES = ['players', 'blocks', 'history', 'matches', 'last_draw'];

    // One-time migration: existing (unprefixed) data becomes the Monday patota.
    (function migrateLegacyToSegunda() {
      const alreadyMigrated = STORE_NAMES.some(n => localStorage.getItem('sorteio_segunda_' + n) !== null);
      if (alreadyMigrated) return;
      STORE_NAMES.forEach(n => {
        const old = localStorage.getItem('sorteio_' + n);
        if (old !== null) {
          localStorage.setItem('sorteio_segunda_' + n, old);
          localStorage.removeItem('sorteio_' + n);
        }
      });
    })();

    createApp({
      setup() {
        const currentDay = ref(DAYS.includes(localStorage.getItem('sorteio_day')) ? localStorage.getItem('sorteio_day') : 'segunda');
        const storeKey = (name) => 'sorteio_' + currentDay.value + '_' + name;
        const load = (name, fallback) => JSON.parse(localStorage.getItem(storeKey(name)) || fallback);

        const players = ref(load('players', '[]').map(migratePlayer));
        const newName = ref('');
        const newGuest = ref(false);
        const newGoalkeeper = ref(false);
        const newRatings = reactive(defaultRatings());
        const teamPreto = ref([]);
        const teamVermelho = ref([]);
        const editingIndex = ref(-1);
        const editRatings = reactive(defaultRatings());
        const history = ref(load('history', '[]'));
        const matches = ref(load('matches', '[]'));
        const scorePreto = ref(null);
        const scoreVermelho = ref(null);
        const swapFrom = ref(null);
        const drawModified = ref(false);
        const blocks = ref(load('blocks', '[]'));
        const blockPlayer1 = ref('');
        const blockPlayer2 = ref('');

        // ---- UI (redesign de 5 abas) ----
        const activeTab = ref('hoje');
        const timesTab = ref('partida');
        const rankingScope = ref(currentDay.value);
        const rankingMetric = ref('pontos'); // 'pontos' | 'presenca'
        const elencoSearch = ref('');
        const showAdd = ref(false);
        const showBlocks = ref(false);
        const copyMsg = ref('');
        const showFaltas = ref(false);
        const nowLabel = new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }) +
          ' · ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

        // Restore last draw
        const lastDraw = load('last_draw', 'null');
        const currentDrawId = ref(lastDraw && lastDraw.id ? lastDraw.id : null);
        if (lastDraw) {
          teamPreto.value = lastDraw.preto;
          teamVermelho.value = lastDraw.vermelho;
        }

        let suspendPersist = false;

        // ---- Cloud sync (Firebase) state ----
        const cloudEnabled = ref(false);   // Firebase carregou
        const canEdit = ref(true);         // pode editar? (true offline; definido ao ligar a nuvem)
        const editCode = ref(localStorage.getItem('sorteio_editcode') || '');
        const syncStatus = ref('local');   // 'local' | 'online' | 'erro'
        let applyingRemote = false;        // aplicando dado remoto -> nao re-empurrar
        let cloudUnsub = null;             // cancela a assinatura do dia atual

        // Flush the current day's data to its keys synchronously (avoids async watcher races)
        function saveCurrentDay() {
          localStorage.setItem(storeKey('players'), JSON.stringify(players.value));
          localStorage.setItem(storeKey('blocks'), JSON.stringify(blocks.value));
          localStorage.setItem(storeKey('history'), JSON.stringify(history.value));
          localStorage.setItem(storeKey('matches'), JSON.stringify(matches.value));
          localStorage.setItem(storeKey('last_draw'), JSON.stringify({
            id: currentDrawId.value, preto: teamPreto.value, vermelho: teamVermelho.value
          }));
        }

        // Switch patota (day): save current day synchronously, then reload from that day's keys
        function switchDay(day) {
          if (day === currentDay.value || !DAYS.includes(day)) return;
          saveCurrentDay();          // persist the outgoing day from current refs (sync)
          suspendPersist = true;     // stop async watchers from writing during the swap
          currentDay.value = day;
          localStorage.setItem('sorteio_day', day);
          players.value = load('players', '[]').map(migratePlayer);
          blocks.value = load('blocks', '[]');
          history.value = load('history', '[]');
          matches.value = load('matches', '[]');
          const ld = load('last_draw', 'null');
          teamPreto.value = ld && ld.preto ? ld.preto : [];
          teamVermelho.value = ld && ld.vermelho ? ld.vermelho : [];
          currentDrawId.value = ld && ld.id ? ld.id : null;
          // reset transient UI state
          editingIndex.value = -1;
          swapFrom.value = null;
          drawModified.value = false;
          scorePreto.value = null;
          scoreVermelho.value = null;
          blockPlayer1.value = '';
          blockPlayer2.value = '';
          newName.value = '';
          newGuest.value = false;
          Vue.nextTick(() => { suspendPersist = false; });
          subscribeCloud(); // ouvir o novo dia na nuvem
        }

        // Win tally for the current teams (matches recorded since the last sort)
        const sessionRecord = Vue.computed(() => {
          const rec = { preto: 0, vermelho: 0, empate: 0 };
          if (!currentDrawId.value) return rec;
          for (const m of matches.value) {
            if (m.drawId === currentDrawId.value && rec[m.winner] !== undefined) rec[m.winner]++;
          }
          return rec;
        });

        // A team reached 2 wins in this round -> a new base draw is mandatory
        const mustResort = Vue.computed(() =>
          !!currentDrawId.value && (sessionRecord.value.preto >= 2 || sessionRecord.value.vermelho >= 2)
        );

        const activePlayers = Vue.computed(() => players.value.filter(p => p.active));
        const confirmedPlayers = Vue.computed(() => players.value.filter(p => p.active && p.confirmed));
        // Base pool = ALL active regulars (guests never enter the base draw; confirmation not required here)
        const baseRegulars = Vue.computed(() => players.value.filter(p => p.active && !p.guest));
        const fieldRegulars = Vue.computed(() => baseRegulars.value.filter(p => !p.goalkeeper));   // jogadores de linha (balanceados)
        const keeperRegulars = Vue.computed(() => baseRegulars.value.filter(p => p.goalkeeper));    // goleiros fixos
        const confirmedGuests = Vue.computed(() => players.value.filter(p => p.active && p.confirmed && p.guest));

        // Base teams derive from each regular's stored base assignment
        const baseSorted = Vue.computed(() => baseRegulars.value.some(p => p.base === 'preto' || p.base === 'vermelho'));
        // Ordena: goleiros no topo, depois alfabetico
        const gkFirst = (arr) => [...arr].sort((a, b) => (b.goalkeeper ? 1 : 0) - (a.goalkeeper ? 1 : 0) || a.name.localeCompare(b.name, 'pt-BR'));
        const baseTeamPreto = Vue.computed(() => gkFirst(baseRegulars.value.filter(p => p.base === 'preto')));
        const baseTeamVermelho = Vue.computed(() => gkFirst(baseRegulars.value.filter(p => p.base === 'vermelho')));
        // Times da partida ordenados (goleiro no topo, depois alfabetico) para exibir/copiar
        const teamPretoView = Vue.computed(() => gkFirst(teamPreto.value));
        const teamVermelhoView = Vue.computed(() => gkFirst(teamVermelho.value));
        const unassignedRegulars = Vue.computed(() => baseRegulars.value.filter(p => p.base !== 'preto' && p.base !== 'vermelho'));
        // Everyone confirmed plays: base members + recovered regulars (as guests) + real guests
        const matchPlayerCount = Vue.computed(() => confirmedPlayers.value.length);

        // Standings built from the match results (covers everyone who played, guests included)
        const standings = Vue.computed(() => {
          const map = {};
          const ensure = (name) => (map[name] || (map[name] = { name, jogos: 0, vitorias: 0, empates: 0, derrotas: 0 }));
          const tally = (names, side, winner) => {
            (names || []).forEach(n => {
              const s = ensure(n);
              s.jogos++;
              if (winner === 'empate') s.empates++;
              else if (winner === side) s.vitorias++;
              else s.derrotas++;
            });
          };
          for (const m of matches.value) {
            tally(m.preto, 'preto', m.winner);
            tally(m.vermelho, 'vermelho', m.winner);
          }
          const arr = Object.values(map).map(s => ({
            ...s,
            pontos: s.vitorias * 3 + s.empates,
            aprov: s.jogos ? Math.round((s.vitorias * 3 + s.empates) / (s.jogos * 3) * 100) : 0
          }));
          arr.sort((a, b) => b.pontos - a.pontos || b.aprov - a.aprov || b.vitorias - a.vitorias || a.name.localeCompare(b.name));
          return arr;
        });

        const availableBlockPlayers = Vue.computed(() => {
          return baseRegulars.value.filter(p => p.name !== blockPlayer1.value);
        });

        watch(players, (val) => {
          if (suspendPersist) return;
          localStorage.setItem(storeKey('players'), JSON.stringify(val));
          if (!applyingRemote) pushCloud();
        }, { deep: true });

        watch(blocks, (val) => {
          if (suspendPersist) return;
          localStorage.setItem(storeKey('blocks'), JSON.stringify(val));
          if (!applyingRemote) pushCloud();
        }, { deep: true });

        watch(history, (val) => {
          if (suspendPersist) return;
          localStorage.setItem(storeKey('history'), JSON.stringify(val));
          if (!applyingRemote) pushCloud();
        }, { deep: true });

        watch(matches, (val) => {
          if (suspendPersist) return;
          localStorage.setItem(storeKey('matches'), JSON.stringify(val));
          if (!applyingRemote) pushCloud();
        }, { deep: true });

        function addPlayer() {
          if (!newName.value) return;
          players.value.push({
            name: newName.value,
            active: true,
            confirmed: newGuest.value,   // guests are added because they're playing today
            guest: newGuest.value,
            base: null,                  // set by the base draw (regulars only)
            goalkeeper: newGoalkeeper.value,
            naLinha: false,
            faltou: false,
            ratings: { ...newRatings }
          });
          newName.value = '';
          newGuest.value = false;
          newGoalkeeper.value = false;
          Object.assign(newRatings, defaultRatings());
        }

        function toggleGoalkeeper(index) {
          if (!requireEdit()) return;
          players.value[index].goalkeeper = !players.value[index].goalkeeper;
        }

        function toggleNaLinha(index) {
          const p = players.value[index];
          if (!p.goalkeeper || !p.confirmed || !p.active) return;
          p.naLinha = !p.naLinha;
        }

        function toggleFaltou(index) {
          if (!requireEdit()) return;
          const p = players.value[index];
          if (!p.confirmed || !p.active) return;
          p.faltou = !p.faltou;
        }

        function toggleConfirm(index) {
          const p = players.value[index];
          if (!p.active) return; // injured players can't be confirmed
          p.confirmed = !p.confirmed;
        }

        function confirmAll() {
          players.value.forEach(p => { if (p.active) p.confirmed = true; });
        }

        function newDay() {
          if (!confirm('Iniciar um novo dia? Desmarca a presenca de todos (o TIME BASE e mantido) e limpa os times da partida atuais.')) return;
          players.value.forEach(p => { p.confirmed = false; p.naLinha = false; p.faltou = false; });
          teamPreto.value = [];
          teamVermelho.value = [];
          currentDrawId.value = baseSorted.value ? Date.now() : null;
          scorePreto.value = null;
          scoreVermelho.value = null;
          swapFrom.value = null;
          localStorage.removeItem(storeKey('last_draw'));
        }

        function removePlayer(index) {
          if (editingIndex.value === index) editingIndex.value = -1;
          else if (editingIndex.value > index) editingIndex.value--;
          players.value.splice(index, 1);
        }

        function clearGuests() {
          const guests = players.value.filter(p => p.guest);
          if (!guests.length) { alert('Nao ha convidados para remover.'); return; }
          if (!confirm('Remover todos os ' + guests.length + ' convidado(s) da lista?')) return;
          editingIndex.value = -1;
          players.value = players.value.filter(p => !p.guest);
          teamPreto.value = teamPreto.value.filter(p => !p.guest);
          teamVermelho.value = teamVermelho.value.filter(p => !p.guest);
          saveLastDraw();
        }

        // Revert the base teams to a past base draw from the history
        function restoreBase(h) {
          const pretoNames = new Set(h.preto);
          const vermNames = new Set(h.vermelho);
          const willAssign = players.value.some(p =>
            !p.guest && p.active && (pretoNames.has(p.name) || vermNames.has(p.name)));
          if (!willAssign) { alert('Nenhum jogador deste sorteio esta disponivel para reverter.'); return; }
          if (!confirm('Reverter o time base para este sorteio de ' + h.date + '? Os times da partida serao regerados e as vitorias da rodada zeram.')) return;

          players.value.forEach(p => {
            if (!p.guest && p.active && pretoNames.has(p.name)) p.base = 'preto';
            else if (!p.guest && p.active && vermNames.has(p.name)) p.base = 'vermelho';
            else p.base = null;
          });
          currentDrawId.value = Date.now(); // new session -> resets the win tally
          generateMatchTeams();
        }

        function toggleActive(index) {
          players.value[index].active = !players.value[index].active;
        }

        function toggleEdit(index) {
          if (cloudEnabled.value && !canEdit.value) return; // somente leitura: nao abre as notas
          if (editingIndex.value === index) {
            editingIndex.value = -1;
            return;
          }
          editingIndex.value = index;
          const r = players.value[index].ratings;
          Object.assign(editRatings, { ...r });
        }

        function saveRatings(index) {
          players.value[index].ratings = { ...editRatings };
          editingIndex.value = -1;
        }

        function addBlock() {
          if (!blockPlayer1.value || !blockPlayer2.value) return;
          const exists = blocks.value.some(b =>
            (b[0] === blockPlayer1.value && b[1] === blockPlayer2.value) ||
            (b[0] === blockPlayer2.value && b[1] === blockPlayer1.value)
          );
          if (exists) return;
          blocks.value.push([blockPlayer1.value, blockPlayer2.value]);
          blockPlayer1.value = '';
          blockPlayer2.value = '';
        }

        function removeBlock(index) {
          blocks.value.splice(index, 1);
        }

        function checkBlocks(teamA, teamB) {
          for (const [p1, p2] of blocks.value) {
            const p1inA = teamA.some(p => p.name === p1);
            const p2inA = teamA.some(p => p.name === p2);
            if (p1inA && p2inA) return false;
            const p1inB = teamB.some(p => p.name === p1);
            const p2inB = teamB.some(p => p.name === p2);
            if (p1inB && p2inB) return false;
          }
          return true;
        }

        function teamScore(team) {
          return team.reduce((sum, p) => sum + avgRating(p.ratings), 0);
        }

        function saveLastDraw() {
          const draw = { id: currentDrawId.value, preto: teamPreto.value, vermelho: teamVermelho.value };
          localStorage.setItem(storeKey('last_draw'), JSON.stringify(draw));
          if (!applyingRemote) pushCloud();
        }

        // DRAW 1: the base teams — ALL active regulars, persists until a team wins twice.
        function sortBaseTeams() {
          const pool = fieldRegulars.value; // goleiros nao entram no balanceamento de linha
          if (baseRegulars.value.length < 2) return;

          // Previous base grouping so we can maximize the change
          const prevA = pool.filter(p => p.base === 'preto').map(p => p.name);
          const prevB = pool.filter(p => p.base === 'vermelho').map(p => p.name);

          const all = pool.map(p => ({ name: p.name, ratings: { ...p.ratings } }));
          all.sort((a, b) => avgRating(b.ratings) - avgRating(a.ratings));

          let bestA = null, bestB = null, bestCost = Infinity;

          for (let attempt = 0; attempt < 300; attempt++) {
            const a = [];
            const b = [];
            const shuffled = [...all];

            if (attempt > 0) {
              for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                if (Math.abs(avgRating(shuffled[i].ratings) - avgRating(shuffled[j].ratings)) <= 0.5) {
                  [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
              }
            }

            shuffled.forEach((p, i) => {
              const round = Math.floor(i / 2);
              const pick = i % 2;
              if (round % 2 === 0) {
                pick === 0 ? a.push(p) : b.push(p);
              } else {
                pick === 0 ? b.push(p) : a.push(p);
              }
            });

            if (!checkBlocks(a, b)) continue;

            const diff = Math.abs(teamScore(a) - teamScore(b));
            // Balance first; among balanced options, prefer maximum change vs the last base draw.
            const overlap = overlapCount(a, b, prevA, prevB);
            const changeRatio = all.length ? overlap / all.length : 0;
            const cost = diff + 0.25 * changeRatio;
            if (cost < bestCost) {
              bestCost = cost;
              bestA = [...a];
              bestB = [...b];
            }
          }

          // Fallback if no valid arrangement found
          if (!bestA) {
            const a = [];
            const b = [];
            all.forEach((p, i) => {
              const round = Math.floor(i / 2);
              const pick = i % 2;
              if (round % 2 === 0) {
                pick === 0 ? a.push(p) : b.push(p);
              } else {
                pick === 0 ? b.push(p) : a.push(p);
              }
            });

            for (const [p1, p2] of blocks.value) {
              const p1inA = a.findIndex(p => p.name === p1);
              const p2inA = a.findIndex(p => p.name === p2);
              if (p1inA !== -1 && p2inA !== -1) {
                const swapIdx = b.findIndex(bp => !blocks.value.some(bl =>
                  (bl[0] === bp.name && bl[1] === p1) || (bl[1] === bp.name && bl[0] === p1)
                ));
                if (swapIdx !== -1) [a[p2inA], b[swapIdx]] = [b[swapIdx], a[p2inA]];
              }
              const p1inB = b.findIndex(p => p.name === p1);
              const p2inB = b.findIndex(p => p.name === p2);
              if (p1inB !== -1 && p2inB !== -1) {
                const swapIdx = a.findIndex(ap => !blocks.value.some(bl =>
                  (bl[0] === ap.name && bl[1] === p1) || (bl[1] === ap.name && bl[0] === p1)
                ));
                if (swapIdx !== -1) [b[p2inB], a[swapIdx]] = [a[swapIdx], b[p2inB]];
              }
            }
            bestA = a;
            bestB = b;
          }

          // Atribui 1 goleiro por time; o goleiro melhor vai pro time de linha mais fraco (balanceia)
          const keepers = keeperRegulars.value.map(p => ({ name: p.name, ratings: { ...p.ratings } }))
            .sort((a, b) => avgRating(b.ratings) - avgRating(a.ratings));
          const scoreA = teamScore(bestA), scoreB = teamScore(bestB);
          let keeperA = null, keeperB = null;
          if (keepers[0]) { if (scoreA <= scoreB) keeperA = keepers[0]; else keeperB = keepers[0]; }
          if (keepers[1]) { if (!keeperA) keeperA = keepers[1]; else if (!keeperB) keeperB = keepers[1]; }
          // goleiros extras (3o+) ficam sem base -> entram como reserva/linha na partida

          // Cor aleatoria por lado; grava base nos jogadores de linha + goleiros atribuidos
          const aIsPreto = Math.random() < 0.5;
          const colorA = aIsPreto ? 'preto' : 'vermelho';
          const colorB = aIsPreto ? 'vermelho' : 'preto';
          const baseMap = {};
          bestA.forEach(p => baseMap[p.name] = colorA);
          bestB.forEach(p => baseMap[p.name] = colorB);
          if (keeperA) baseMap[keeperA.name] = colorA;
          if (keeperB) baseMap[keeperB.name] = colorB;
          players.value.forEach(p => { p.base = baseMap[p.name] || null; });

          currentDrawId.value = Date.now();

          const now = new Date();
          const dateStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          history.value.unshift({
            date: dateStr,
            preto: Object.keys(baseMap).filter(n => baseMap[n] === 'preto'),
            vermelho: Object.keys(baseMap).filter(n => baseMap[n] === 'vermelho')
          });

          // Build today's match teams from the fresh base
          generateMatchTeams();
        }

        // DRAW 2: the match teams — confirmed base members + guests (auto-distributed) + goleiros no gol.
        function generateMatchTeams() {
          if (!baseSorted.value) { alert('Sorteie o time base primeiro.'); return; }

          const inGoal = (p) => p.goalkeeper && !p.naLinha; // goleiro que vai pro gol (nao "na linha")
          const conf = (p) => p.active && p.confirmed;

          // Jogadores de LINHA (goleiro "na linha" tambem conta como linha)
          const basePreto = players.value
            .filter(p => conf(p) && !p.guest && !inGoal(p) && p.base === 'preto')
            .map(p => ({ name: p.name, ratings: { ...p.ratings }, guest: false }));
          const baseVerm = players.value
            .filter(p => conf(p) && !p.guest && !inGoal(p) && p.base === 'vermelho')
            .map(p => ({ name: p.name, ratings: { ...p.ratings }, guest: false }));

          // Avulsos de linha: regulares confirmados sem base (voltaram de lesao) — tratados como convidados
          const floaters = players.value
            .filter(p => conf(p) && !p.guest && !inGoal(p) && p.base !== 'preto' && p.base !== 'vermelho')
            .map(p => ({ name: p.name, ratings: { ...p.ratings }, guest: false, floater: true }));
          const guests = confirmedGuests.value
            .filter(p => !inGoal(p))
            .map(p => ({ name: p.name, ratings: { ...p.ratings }, guest: true }));

          // Distribui avulsos + convidados de linha (tamanho, depois nota)
          const extras = [...floaters, ...guests].sort((a, b) => avgRating(b.ratings) - avgRating(a.ratings));
          const teamA = [...basePreto], teamB = [...baseVerm]; // A = Preto, B = Vermelho
          let scoreA = teamScore(teamA), scoreB = teamScore(teamB);
          for (const g of extras) {
            let toA;
            if (teamA.length !== teamB.length) toA = teamA.length < teamB.length;
            else toA = scoreA <= scoreB;
            if (toA) { teamA.push(g); scoreA += avgRating(g.ratings); }
            else { teamB.push(g); scoreB += avgRating(g.ratings); }
          }

          // Goleiros no gol: 1 por time (prefere o do time base; convidado goleiro cobre falta)
          const confKeepers = players.value.filter(p => conf(p) && inGoal(p));
          let kPreto = confKeepers.find(k => k.base === 'preto');
          let kVerm = confKeepers.find(k => k.base === 'vermelho');
          const spares = confKeepers.filter(k => k !== kPreto && k !== kVerm);
          if (!kPreto && spares.length) kPreto = spares.shift();
          if (!kVerm && spares.length) kVerm = spares.shift();
          // goleiros que sobraram (3o+) jogam na linha
          spares.sort((a, b) => avgRating(b.ratings) - avgRating(a.ratings)).forEach(k => {
            const g = { name: k.name, ratings: { ...k.ratings }, guest: !!k.guest, floater: true };
            (teamA.length <= teamB.length ? teamA : teamB).push(g);
          });
          const gk = (p) => ({ name: p.name, ratings: { ...p.ratings }, guest: !!p.guest, goalkeeper: true });

          teamPreto.value = kPreto ? [gk(kPreto), ...teamA] : teamA;
          teamVermelho.value = kVerm ? [gk(kVerm), ...teamB] : teamB;
          swapFrom.value = null;
          drawModified.value = false;
          scorePreto.value = null;
          scoreVermelho.value = null;
          saveLastDraw();
        }

        // Troca por identidade (o nome), pois a exibicao esta ordenada (indices nao batem com o array real)
        function selectSwap(team, p) {
          if (!swapFrom.value) { swapFrom.value = { team, name: p.name }; return; }
          if (swapFrom.value.team === team) {
            swapFrom.value = swapFrom.value.name === p.name ? null : { team, name: p.name };
            return;
          }
          const fromTeam = swapFrom.value.team === 'preto' ? teamPreto : teamVermelho;
          const toTeam = team === 'preto' ? teamPreto : teamVermelho;
          const fi = fromTeam.value.findIndex(x => x.name === swapFrom.value.name);
          const ti = toTeam.value.findIndex(x => x.name === p.name);
          if (fi !== -1 && ti !== -1) {
            const temp = fromTeam.value[fi];
            fromTeam.value[fi] = toTeam.value[ti];
            toTeam.value[ti] = temp;
            teamPreto.value = [...teamPreto.value];
            teamVermelho.value = [...teamVermelho.value];
            drawModified.value = true;
          }
          swapFrom.value = null;
        }

        function saveModifiedDraw() {
          saveLastDraw();
          drawModified.value = false;
        }

        function registerMatch() {
          if (!teamPreto.value.length || !teamVermelho.value.length) return;
          if (mustResort.value) {
            alert('Um time ja venceu 2 vezes. Sorteie os times novamente antes de registrar a proxima partida.');
            return;
          }
          const sp = Number(scorePreto.value);
          const sv = Number(scoreVermelho.value);
          if (!Number.isFinite(sp) || !Number.isFinite(sv) || sp < 0 || sv < 0) {
            alert('Informe o placar dos dois times.');
            return;
          }
          const now = new Date();
          const dateStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          // quem marcou presenca mas faltou: nao conta como presente e vai para "faltas"
          const faltou = new Set(players.value.filter(p => p.faltou).map(p => p.name));
          matches.value.unshift({
            drawId: currentDrawId.value,
            date: dateStr,
            preto: teamPreto.value.map(p => p.name).filter(n => !faltou.has(n)),
            vermelho: teamVermelho.value.map(p => p.name).filter(n => !faltou.has(n)),
            faltas: [...faltou],
            scorePreto: sp,
            scoreVermelho: sv,
            winner: sp > sv ? 'preto' : (sv > sp ? 'vermelho' : 'empate')
          });
          scorePreto.value = null;
          scoreVermelho.value = null;
        }

        function removeMatch(index) {
          matches.value.splice(index, 1);
        }

        function clearMatches() {
          if (!confirm('Limpar todo o historico de partidas (e a classificacao)?')) return;
          matches.value = [];
          localStorage.removeItem(storeKey('matches'));
        }

        function clearHistory() {
          if (!confirm('Limpar todo o historico de sorteios de base?')) return;
          history.value = [];
          localStorage.removeItem(storeKey('history'));
        }

        function removeHistory(index) {
          history.value.splice(index, 1);
        }

        function exportData() {
          const data = {
            app: 'sorteio-de-times',
            version: 1,
            day: currentDay.value,
            exportedAt: new Date().toISOString(),
            players: players.value,
            blocks: blocks.value,
            history: history.value,
            matches: matches.value,
            lastDraw: { id: currentDrawId.value, preto: teamPreto.value, vermelho: teamVermelho.value }
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const stamp = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `sorteio-${currentDay.value}-backup-${stamp}.json`;
          a.click();
          URL.revokeObjectURL(url);
        }

        function importData(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = JSON.parse(e.target.result);
              if (!data || !Array.isArray(data.players)) {
                alert('Arquivo invalido: nao contem jogadores.');
                return;
              }
              if (!confirm('Isso vai substituir os dados da patota atual (' + DAY_LABELS[currentDay.value] + '). Continuar?')) return;

              players.value = data.players.map(migratePlayer);
              blocks.value = Array.isArray(data.blocks) ? data.blocks : [];
              history.value = Array.isArray(data.history) ? data.history : [];
              matches.value = Array.isArray(data.matches) ? data.matches : [];

              if (data.lastDraw && Array.isArray(data.lastDraw.preto)) {
                teamPreto.value = data.lastDraw.preto;
                teamVermelho.value = Array.isArray(data.lastDraw.vermelho) ? data.lastDraw.vermelho : [];
                currentDrawId.value = data.lastDraw.id || null;
                localStorage.setItem(storeKey('last_draw'), JSON.stringify({
                  id: currentDrawId.value, preto: teamPreto.value, vermelho: teamVermelho.value
                }));
              } else {
                teamPreto.value = [];
                teamVermelho.value = [];
                currentDrawId.value = null;
                localStorage.removeItem(storeKey('last_draw'));
              }

              swapFrom.value = null;
              drawModified.value = false;
              editingIndex.value = -1;
              alert('Dados importados com sucesso!');
            } catch (err) {
              alert('Erro ao ler o arquivo: ' + err.message);
            }
          };
          reader.readAsText(file);
          event.target.value = '';
        }

        // ---- Redesign: computeds e helpers ----
        function fmtAvg(r) { return avgRating(r).toFixed(1).replace('.', ','); }
        function teamAvg(team) { return team && team.length ? (teamScore(team) / team.length).toFixed(1).replace('.', ',') : '0,0'; }
        function starsOn(r) { return '★'.repeat(Math.round(avgRating(r))); }
        function starsOff(r) { return '★'.repeat(5 - Math.round(avgRating(r))); }
        function incScore(w) { const rf = w === 'preto' ? scorePreto : scoreVermelho; rf.value = (Number(rf.value) || 0) + 1; }
        function decScore(w) { const rf = w === 'preto' ? scorePreto : scoreVermelho; rf.value = Math.max(0, (Number(rf.value) || 0) - 1); }
        function winLabel(w) { return w === 'preto' ? 'Preto' : w === 'vermelho' ? 'Vermelho' : 'empate'; }
        function winColor(w) { return w === 'vermelho' ? 'var(--red)' : w === 'preto' ? 'var(--t3)' : 'var(--t4)'; }
        function realIndex(p) { return players.value.findIndex(x => x === p); }
        function goAddGuest() { activeTab.value = 'elenco'; showAdd.value = true; newGuest.value = true; }
        // Monta o texto formatado dos times (partida ou base) pra colar no WhatsApp
        function buildTeamsText() {
          const isBase = timesTab.value === 'base';
          const preto = isBase ? baseTeamPreto.value : teamPretoView.value;
          const verm = isBase ? baseTeamVermelho.value : teamVermelhoView.value;
          if (!preto.length && !verm.length) return '';
          const linha = (p) => {
            let nome = p.name;
            if (p.guest) nome += ' _(convidado)_';
            else if (p.floater) nome += ' _(extra)_';
            return (p.goalkeeper ? '🧤 ' : '• ') + nome;
          };
          const bloco = (emoji, nome, arr) =>
            `${emoji} *${nome}*  _(média ${teamAvg(arr)})_\n` + arr.map(linha).join('\n');
          const header = isBase
            ? `_${DAY_LABELS[currentDay.value]} · time base_`
            : `_${DAY_LABELS[currentDay.value]} · ${new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}_`;
          return `⚽ *PATOTA GALO TITO*\n${header}\n\n` +
            bloco('⚫', 'PRETO', preto) + '\n\n' +
            bloco('🔴', 'VERMELHO', verm) +
            '\n\n_🧤 goleiro · convidado marcado_';
        }
        function copyTeams() {
          const texto = buildTeamsText();
          if (!texto) { alert('Gere os times primeiro.'); return; }
          const ok = () => { copyMsg.value = 'Copiado! Agora é só colar no WhatsApp 📋'; setTimeout(() => { copyMsg.value = ''; }, 3000); };
          const fallback = () => {
            const ta = document.createElement('textarea');
            ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); ok(); } catch (e) { alert('Nao consegui copiar. Segure para selecionar:\n\n' + texto); }
            document.body.removeChild(ta);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(texto).then(ok).catch(fallback);
          } else fallback();
        }
        function copyPlayer(name) {
          if (!name || !requireEdit()) return;
          const src = otherDayPlayers.value.find(p => p.name === name);
          if (!src) return;
          players.value.push({ name: src.name, active: true, confirmed: false, guest: false, base: null, goalkeeper: !!src.goalkeeper, naLinha: false, faltou: false, ratings: { ...src.ratings } });
        }

        // Em modo nuvem sem edicao liberada: notas individuais ficam ocultas
        const readOnly = Vue.computed(() => cloudEnabled.value && !canEdit.value);
        const confPct = Vue.computed(() => activePlayers.value.length ? Math.round(confirmedPlayers.value.length / activePlayers.value.length * 100) : 0);
        const confBase = Vue.computed(() => baseRegulars.value.filter(p => p.confirmed).length);
        const confGuests = Vue.computed(() => confirmedGuests.value.length);
        const faltam = Vue.computed(() => activePlayers.value.filter(p => !p.confirmed).length);
        const faltosos = Vue.computed(() => players.value.filter(p => p.faltou));
        const otherDayName = Vue.computed(() => currentDay.value === 'segunda' ? 'quarta' : 'segunda');
        const otherDayPlayers = Vue.computed(() => {
          const raw = JSON.parse(localStorage.getItem('sorteio_' + otherDayName.value + '_players') || '[]');
          return raw.filter(op => op && op.name && !players.value.some(p => p.name === op.name));
        });
        const filteredElenco = Vue.computed(() => {
          const q = elencoSearch.value.trim().toLowerCase();
